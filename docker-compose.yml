services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pensieve
      POSTGRES_USER: pensieve
      POSTGRES_PASSWORD: pensieve
    # Local development only. Do not publish Postgres directly in production.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensieve -d pensieve"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./backend/.env
        required: false
    command: sh -c "npm ci && npm run db:migrate"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pensieve
      DB_USER: pensieve
      DB_PASSWORD: pensieve
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./backend/.env
        required: false
    command: sh -c "npm ci && npm run dev"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pensieve
      DB_USER: pensieve
      DB_PASSWORD: pensieve
      PORT: 3001
      FRONTEND_URL: http://localhost:5174
    expose:
      - "3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./frontend/.env.local
        required: false
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
